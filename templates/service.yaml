apiVersion: v1
kind: Service
metadata:
  name: nginx
    # service labels
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: deployment
      # Service uses the below labels to select the pods
spec:
  type: {{ .Values.service.type }}
  selector:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: deployment
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 #container port
